services:
  - type: web
    name: ai-crypto-monitor
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT src.ai_crypto_monitor.webapp:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: ai-crypto-monitor-data
      mountPath: /opt/render/project/src/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: AI_CRYPTO_MONITOR_HOST
        value: 0.0.0.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
